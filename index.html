<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Commitment Checklist</title>
<!-- Bump ?v= on styles.css/app.js whenever their content changes, so
     browsers and any CDN/proxy in front of this site fetch the new file
     instead of serving a stale cached copy under the same URL. -->
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <header class="topbar">
    <div class="balance-card">
      <div class="balance-head">
        <span class="balance-label">Balance</span>
        <span class="cycle-chip" id="cycleChip">
          <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3v4M16 3v4M3.5 10h17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span id="cycleLabel"></span>
        </span>
      </div>
      <div class="balance-amount" id="balanceAmount"></div>
      <div class="balance-breakdown">
        <div class="chip chip-income">
          <span class="dot"></span>Income
          <strong id="incomeTotal">RM0.00</strong>
        </div>
        <div class="chip chip-commitments">
          <span class="dot"></span>Commitments
          <strong id="commitmentsTotal">RM0.00</strong>
        </div>
        <div class="chip chip-savings">
          <span class="dot"></span>To Savings
          <strong id="savingsTotal">RM0.00</strong>
        </div>
      </div>
    </div>
  </header>

  <!-- Shown when the calendar has moved on from the stored cycle month -->
  <div class="cycle-banner" id="cycleBanner" hidden>
    <div class="cycle-banner-text">
      <strong>It's <span id="bannerNewMonth"></span></strong>
      <span>You're still on the <span id="bannerOldMonth"></span> cycle.</span>
    </div>
    <button class="cycle-banner-btn" id="cycleRollBtn" type="button">Start new cycle</button>
  </div>

  <main class="sections-grid" id="sectionsGrid"></main>

  <footer class="page-footer">
    <button class="clear-btn" id="clearBtn" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Clear checkmarks
    </button>
  </footer>

  <!-- Add / edit sheet: shows the live balance as the amount is typed -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grabber"></div>

      <div class="sheet-topbar">
        <button class="sheet-btn" id="sheetCancel" type="button">Cancel</button>
        <span class="sheet-title" id="sheetTitle">New item</span>
        <button class="sheet-btn strong" id="sheetSave" type="button">Save</button>
      </div>

      <div class="sheet-preview">
        <div class="sheet-preview-label">Balance after this</div>
        <div class="sheet-preview-amount" id="sheetBalance"></div>
        <div class="sheet-preview-delta" id="sheetDelta"></div>
      </div>

      <div class="sheet-fields">
        <label class="sheet-field">
          <span class="sheet-field-label">Name</span>
          <input class="sheet-name" id="sheetName" type="text" placeholder="e.g. Rent" autocomplete="off">
        </label>

        <label class="sheet-field">
          <span class="sheet-field-label">Amount</span>
          <span class="sheet-amount-wrap">
            <span class="rm-prefix">RM</span>
            <input class="sheet-amount" id="sheetAmount" type="text" inputmode="numeric" autocomplete="off" placeholder="0.00">
          </span>
        </label>
      </div>

      <p class="sheet-hint">Cents first — tapping <b>1 2 5 0</b> gives <b>RM 12.50</b></p>

      <button class="sheet-delete" id="sheetDelete" type="button" hidden>Delete item</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3>Start a new cycle?</h3>
      <p id="modalBody">This unchecks every item and moves you to the current month. Your items and amounts stay the same.</p>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modalCancel" type="button">Cancel</button>
        <button class="modal-btn confirm" id="modalConfirm" type="button">Clear</button>
      </div>
    </div>
  </div>

  <template id="section-template">
    <section class="section" data-key="">
      <header class="section-header">
        <div class="section-title">
          <span class="section-icon"></span>
          <h2></h2>
        </div>
        <span class="section-total">RM0.00</span>
      </header>
      <ul class="item-list"></ul>
      <button class="add-row" type="button">
        <span class="add-row-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </span>
        Add item
      </button>
    </section>
  </template>

  <template id="item-template">
    <li class="item" data-id="">
      <button class="checkbox" type="button" aria-label="Toggle done"></button>
      <button class="item-body" type="button">
        <span class="item-name"></span>
        <span class="item-amount"></span>
      </button>
      <button class="delete-btn" type="button" aria-label="Delete item">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </li>
  </template>

  <script src="app.js?v=4" defer></script>
</body>
</html>
