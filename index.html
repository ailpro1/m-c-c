<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Commitment Checklist</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <header class="topbar">
    <div class="balance-card">
      <div class="balance-label">Balance</div>
      <div class="balance-amount" id="balanceAmount">RM&nbsp;0.00</div>
      <div class="balance-breakdown">
        <div class="chip chip-income">
          <span class="dot"></span>Income
          <strong id="incomeTotal">RM0.00</strong>
        </div>
        <div class="chip chip-commitments">
          <span class="dot"></span>Commitments
          <strong id="commitmentsTotal">RM0.00</strong>
        </div>
        <div class="chip chip-savings">
          <span class="dot"></span>To Savings
          <strong id="savingsTotal">RM0.00</strong>
        </div>
      </div>
    </div>
    <button class="clear-btn" id="clearBtn" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Clear checkmarks
    </button>
  </header>

  <main class="sections-grid" id="sectionsGrid"></main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3>Clear all checkmarks?</h3>
      <p>This will uncheck every item in Income, Commitments and To Savings. Your items and amounts stay the same.</p>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modalCancel" type="button">Cancel</button>
        <button class="modal-btn confirm" id="modalConfirm" type="button">Clear</button>
      </div>
    </div>
  </div>

  <template id="section-template">
    <section class="section" data-key="">
      <header class="section-header">
        <div class="section-title">
          <span class="section-icon"></span>
          <h2></h2>
        </div>
        <span class="section-total">RM0.00</span>
      </header>
      <ul class="item-list"></ul>
      <form class="add-item-form">
        <input class="add-name" type="text" placeholder="Item name" autocomplete="off">
        <div class="add-amount-wrap">
          <span class="rm-prefix">RM</span>
          <input class="add-amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
        </div>
        <button class="add-btn" type="submit" aria-label="Add item">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </form>
    </section>
  </template>

  <template id="item-template">
    <li class="item" data-id="">
      <button class="checkbox" type="button" aria-label="Toggle done"></button>
      <input class="item-name" type="text" autocomplete="off">
      <div class="item-amount-wrap">
        <span class="rm-prefix">RM</span>
        <input class="item-amount" type="number" inputmode="decimal" step="0.01" min="0">
      </div>
      <button class="delete-btn" type="button" aria-label="Delete item">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </li>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
