<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Progress ring with a tick">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B84FF"/>
      <stop offset="0.55" stop-color="#5AC8FA"/>
      <stop offset="1" stop-color="#63E6BE"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- Progress ring, echoing the app's own bar: full track, then the arc.
       Circumference is 2·π·18 ≈ 113, so a 86 dash reads as roughly 76% done. -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-opacity="0.32" stroke-width="6.5"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round"
          stroke-dasharray="86 114" transform="rotate(-90 32 32)"/>

  <!-- Ticked off -->
  <path d="M25.6 32.6l4.7 4.7 8.9-9.9" fill="none" stroke="#fff" stroke-width="5.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M50 12.5l1.15 3.1 3.1 1.15-3.1 1.15L50 21l-1.15-3.1-3.1-1.15 3.1-1.15z" fill="#FFD60A"/>
</svg>
