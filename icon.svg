<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Piggy bank with a tick">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B84FF"/>
      <stop offset="0.55" stop-color="#5AC8FA"/>
      <stop offset="1" stop-color="#63E6BE"/>
    </linearGradient>
    <linearGradient id="pig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC2D4"/>
      <stop offset="1" stop-color="#FF9BB8"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- piggy -->
  <g>
    <!-- legs -->
    <rect x="18" y="41" width="6.5" height="9" rx="3.2" fill="#FF8FB0"/>
    <rect x="31" y="41" width="6.5" height="9" rx="3.2" fill="#FF8FB0"/>
    <!-- tail -->
    <path d="M13.5 31c-2.6.2-3.6 2-2.3 3.3 1.2 1.2 3.2.4 3-1.6"
          fill="none" stroke="#FF8FB0" stroke-width="2.4" stroke-linecap="round"/>
    <!-- ear (base tucks under the body, tip stands clear of it) -->
    <path d="M36.2 24.5C37 18.5 38.8 14.8 40.6 14.2c1.8.8 3 4.8 3.6 10.3z" fill="#FF8FB0"/>
    <!-- body -->
    <ellipse cx="29" cy="32" rx="16" ry="13" fill="url(#pig)"/>
    <!-- snout -->
    <ellipse cx="43.2" cy="33.5" rx="6.2" ry="5.4" fill="#FF8FB0"/>
    <ellipse cx="41.6" cy="33.5" rx="1.25" ry="1.7" fill="#E2668A"/>
    <ellipse cx="45.2" cy="33.5" rx="1.25" ry="1.7" fill="#E2668A"/>
    <!-- coin slot -->
    <rect x="21" y="21.5" width="12" height="3.4" rx="1.7" fill="#E2668A" opacity="0.55"/>
    <!-- eye + cheek -->
    <circle cx="35.5" cy="27.5" r="2" fill="#4A2233"/>
    <circle cx="36.2" cy="26.9" r="0.62" fill="#fff"/>
    <circle cx="30" cy="33.5" r="2.6" fill="#FF7BA0" opacity="0.5"/>
  </g>

  <!-- ticked-off badge -->
  <circle cx="48.5" cy="48.5" r="12" fill="#fff"/>
  <circle cx="48.5" cy="48.5" r="9.8" fill="#34C759"/>
  <path d="M43.9 48.7l3.3 3.3 6.1-6.4" fill="none" stroke="#fff"
        stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
